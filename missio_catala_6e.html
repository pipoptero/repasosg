lid #36805b;color:#235c40}.answer.wrong{background:#fff0e5;border:2px solid #b76a33;color:#85451c}.answer:disabled{opacity:1}.answer:disabled:not(.correct):not(.wrong){color:#7b798a}.answer-input{width:100%;padding:15px;border:2px solid #bdb5d5;border-radius:12px;background:#fdfcfe;font-size:21px}.feedback{margin-top:23px;border-radius:15px;padding:19px;background:#e8f5ee;border:1px solid #bbdbc9}.feedback.retry{background:#fff2e8;border-color:#edcfb9}.feedback h3{font-size:20px;margin:0 0 8px}.feedback p{color:#424357;margin:8px 0}.hint{margin-top:15px;background:#fff7dc;padding:12px 17px;border-radius:12px;font-size:15px}.quiz-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:23px;gap:16px}.results{text-align:center;background:white;padding:40px;border:1px solid var(--line);border-radius:25px}.result-icon{font-size:65px}.result-score{font-size:49px;color:var(--purple);font-weight:bold}.results .actions{justify-content:center}.review-item{padding:22px;background:white;border:1px solid var(--line);border-radius:16px;margin:14px 0}.review-item p{font-size:15px}.review-item strong{display:block}.storage-note{background:#fff3d9;padding:10px;border-radius:8px;font-size:13px}.pause{text-align:center;padding:50px 25px;background:#eeebfa;border-radius:22px}footer{border-top:1px solid var(--line);padding:23px 4.5%;display:flex;gap:20px;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:20px;max-width:460px;padding:28px}dialog::backdrop{background:#25213c80}.empty{text-align:center;padding:45px 20px;background:white;border:1px dashed #c4bddd;border-radius:20px}#app:focus{outline:none}@media(max-width:1000px){header{flex-wrap:wrap;gap:18px}nav{order:3;width:100%;justify-content:center}.hero{gap:15px}.art{min-height:280px}.cards{gap:13px}.topic-top{padding:22px 16px}.topic-body{padding:18px 16px}.topic-links{gap:7px}.topic-links a{padding:8px}}@media(max-width:700px) </style></head><body><header><a class="brand" href="#inici"><span class="logo">m<span>✦</span></span> missió català <small>6è de primària</small></a><nav aria-label="Navegació principal"><a href="#inici">El meu mapa</a><a href="#teoria">Teoria</a><a href="#exercicis">Exercicis</a><a href="#repas">El meu repàs <span id="review-count">0</span></a></nav><div class="stars" id="stars">✦ 0 estrelles</div></header><main id="app"></main><footer><span>✦ Pas a pas, cada paraula compta.</span><span>Basat en els teus apunts · El progrés es desa només en aquest navegador.</span><button id="reset" class="text-btn">Reinicia el progrés</button></footer><dialog id="reset-dialog"><h2>Vols començar de nou?</h2><p>S’esborraran les estrelles i el repàs guardats en aquest navegador.</p><div class="actions"><button id="cancel-reset">Conserva el progrés</button><button id="confirm-reset" class="primary">Sí, reinicia</button></div></dialog><script>const topics=[
{id:'sn',icon:'🔎',name:'Detectius del nom',label:'Sintagma nominal',desc:'Descobreix el nucli i les paraules que l’acompanyen.',lessons:[
['Un equip al voltant d’un nom','Un sintagma nominal (SN) té un nucli: normalment un nom, però també pot ser un pronom. Pot portar determinants i complements, i pot aparèixer en diferents llocs de l’oració.','La germana de l’Eva → La: determinant · germana: nucli · de l’Eva: complement. Nosaltres és un SN amb un pronom com a nucli.'],
['Els complements del nom','Afegeixen informació al nom. Poden ser un adjectiu, una preposició + SN o una oració introduïda per que.','Poma vermella → adjectiu. El cofre del pirata → preposició + SN (del = de + el). La noia que canta al cor → que + oració.'],
['La concordança','El determinant i l’adjectiu concorden amb el nom en gènere (masculí/femení) i nombre (singular/plural).','Aquelles noies altes: femení plural. La cadira trencada: femení singular. Un científic innovador: masculí singular.'],
['El subjecte i altres SN','El SN pot fer de subjecte. Pregunta qui o què fa allò que diu el verb i comprova que concordi amb el verb. També hi ha SN que no són subjectes.','Els meus amics de classe preparen una excursió. Subjecte: Els meus amics de classe. Nucli: amics. Una excursió és un altre SN, però no és el subjecte.'],
['Desmuntem un sintagma','Primer localitza el nom principal. Després busca què el determina i quina informació extra l’acompanya.','Un avi simpàtic: determinant + nucli + adjectiu. Una cosina de la Berta: determinant + nucli + preposició i SN. La veïna que em trobo al replà: determinant + nucli + que i oració.']
]},
{id:'lex',icon:'🧩',name:'El taller de paraules',label:'Lèxic',desc:'Construeix paraules amb peces petites i grans idees.',lessons:[
['Primitives, derivades i famílies','Les primitives no es formen afegint prefixos o sufixos a una altra paraula. Les derivades sí. Una primitiva i les seves derivades formen una família de paraules: comparteixen arrel i significat relacionat.','Mar → marí, marítim, mariner, marinera, marinada. Taula → tauleta, taulell, tauler. Porta, joia, camisa, sopa i neu són primitives als exercicis.'],
['Paraules compostes','Uneixen dues paraules simples. Algunes porten guionet. Un prefix no és una paraula simple independent: supermercat és derivada.','Llevataps = lleva + taps. Para-xocs = para + xocs. Penja-roba = penja + roba. També: trencaclosques, muntacàrregues, paracaigudes, rentaplats, salvavides, aiguaneu i passatemps.'],
['Prefixos: davant de la base','re-: repetició · des-: oposició · in-, im-, il-: negació · inter-: entre · pre-: abans (pres- davant s en mots com pressentir).','Reelegir = tornar a elegir. Incapaç = que no és capaç. Desfer és l’acció contrària de fer. Prehistòria = abans de la història.'],
['La col·lecció de prefixos','ante-, avant-: abans/davant · post-, pos-: després · sobre-, super-: damunt/per damunt · semi-: meitat · vice-: càrrec immediatament inferior · a-, an-: negació · circum-: al voltant · pseudo-: fals · ex-: de dins a fora; també anterior en noms de càrrecs.','Semicercle: mig cercle. Pseudocientífic: falsament científic. Ex-presidenta: persona que abans era presidenta.'],
['Sufixos: darrere de l’arrel','-er/-era: oficis, llocs o objectes · -et/-eta: diminutius · -às/-assa: augmentatius · -ós/-osa: qualitat o abundància · -ot/-ota: valor despectiu.','Fruita → fruiter (qui ven fruita). Pastís → pastisset. Amor → amorós. Dur → duresa. Taula → tauleta.'],
['Més sufixos del full','-able/-ible: possibilitat · -ent: agent de l’acció · -itat/-tat: noms abstractes · -dor: pot indicar lloc o agent · -ora: pot formar noms de plantes · -atge: pot formar col·lectius. El significat depèn de la paraula.','Llegible: que es pot llegir. Dormidor: lloc per dormir. Fullatge: conjunt de fulles. No totes les terminacions semblants són sufixos: cal mirar com s’ha format la paraula.']
]},
{id:'pun',icon:'💬',name:'L’illa dels signes',label:'Puntuació',desc:'Dona ritme, pauses i sentit a cada frase.',lessons:[
['El punt i els punts suspensius','El punt tanca una oració; després comencem amb majúscula. Els punts suspensius són tres i deixen oberta una idea o una enumeració.','M’agrada llegir. És divertit. / A la motxilla hi duc roba, llibres, jocs…'],
['La coma','Separa elements d’una enumeració, delimita aclariments i separa el nom de la persona a qui parlem (vocatiu). Habitualment no posem coma abans de la i final d’una llista simple. No separem subjecte i verb amb una coma.','Poma, pera i plàtan. / La Maria, la meva veïna, és amable. / Pau, vine aquí! / La mestra explica el conte.'],
['El punt i coma','Separa parts relacionades d’una oració, sobretot si són llargues o ja tenen comes. La pausa és més forta que la de la coma i més curta que la del punt.','La trama del llibre és fascinant; en canvi, el final és fluix.'],
['Els dos punts','Introdueixen una enumeració anunciada, una explicació o les paraules exactes d’algú.','Necessito tres coses: pa, llet i ous. / Només volia una cosa: prendre un bon bany. / La Maria va dir: «Demà anirem d’excursió».'],
['Les cometes','Marquen paraules exactes d’una altra persona, títols de textos o paraules amb doble sentit. Hi ha diferents formes de cometes.','Ell diu: «Si vols, t’ho explico». / Llegeix «La migració de les aus». / Les seves amigues són molt «simpàtiques» (pot indicar ironia).'],
['Els parèntesis','Envolten informació extra o un aclariment que pots treure sense perdre la idea principal. Sempre cal obrir-los i tancar-los.','Cada bienni (període de dos anys) es presenta un balanç. / Els alumnes de cicle superior (cinquè i sisè) organitzen el Carnestoltes.'],
['Del signe al text','Les preguntes directes acaben amb ?. En textos llargs, separa les idees amb punts i revisa les majúscules, les enumeracions, els aclariments i les citacions.','La mestra va preguntar: «Heu acabat els deures?» / Ahir vam visitar el museu. Vam veure tres exposicions: el cos humà, els planetes i els animals. En Marc (el nostre delegat) va fer una pregunta.']
 ]},
{id:'contr',icon:'🔗',name:'Unim preposicions i articles',label:'Contraccions',desc:'Uneix les paraules amb les contraccions catalanes.',lessons:[
['Què és una contracció?','És la unió d’una preposició i un article en una sola paraula. En català s’escriuen juntes: a + el = al, de + el = del i per + el = pel.','Anem al teatre (a + el). Sortim del teatre (de + el). Passem pel teatre (per + el).'],
['El singular i el plural','Les preposicions a, de i per es contreuen amb els articles masculins el i els: al/als, del/dels i pel/pels.','Vaig al parc i després passejo pels jardins. Torno del poble i parlo dels avis.'],
['Quan no fem la contracció','No hi ha contracció davant la, les ni l’. Cal escriure les dues paraules separades; davant vocal, l’article s’apostrofa.','a la piscina, a les cases, a l’escola · de la branca, de les flors, de l’arbre · per la plaça, per les vies, per l’horari.'],
['Les formes amb ca','Ca és una forma reduïda de casa. Forma cal amb l’article masculí el, cals amb els i can amb l’article personal en. Amb la i amb l’ es manté separat.','Vaig a cal metge (ca + el), a cals oncles (ca + els), a can Ramon (ca + en), a ca la Marta i a ca l’avi. Vigila: ca + l’ no es converteix en cal.']
]}];
const questions=[];
function m(t,q,a,b,c,ex){questions.push({id:questions.length,t,q,opts:[a,b,c],ex});}
function w(t,q,answer,ex,hint){questions.push({id:questions.length,t,q,answer,ex,hint});}
m('sn','Quin és el nucli de «La germana de l’Eva»?','germana','La','Eva','Germana és el nom principal. La és el determinant i de l’Eva és el complement. Eva és dins del complement.');
m('sn','A «Nosaltres preparem les maletes», quin SN fa de subjecte?','Nosaltres','les maletes','preparem','Qui prepara? Nosaltres: un pronom que fa de subjecte. Les maletes és un altre SN i preparem és el verb.');
m('sn','Quin tipus de complement és «vermella» a «poma vermella»?','Adjectiu','Preposició + SN','Que + oració','Vermella descriu una característica de poma: és un adjectiu. No hi ha una preposició ni una oració amb que.');
m('sn','A «El cofre del pirata», «del pirata» és…','Preposició + SN','Adjectiu','Determinant','Del = de + el. La preposició de introdueix el SN el pirata. Tot plegat complementa cofre.');
m('sn','Quin és el complement de «La noia que canta al cor»?','que canta al cor','La','noia','Que canta al cor dona informació sobre noia. La és el determinant; noia és el nucli.');
m('sn','Tria la concordança correcta.','Aquelles noies altes','Aquell noies alt','Aquelles noies alta','Noies és femení plural. El determinant aquelles i l’adjectiu altes han de concordar-hi.');
w('sn','Completa amb el determinant femení singular: «___ cadira trencada».','la','Cadira és femení singular: diem la cadira trencada. Els seria masculí plural.','El plural d’aquest determinant és les.');
m('sn','Quina estructura té «Un avi simpàtic»?','Determinant + nucli + adjectiu','Nucli + determinant + adjectiu','Determinant + nucli + que + oració','Un determina avi, el nom principal. Simpàtic el complementa amb una característica.');
m('sn','Quin és el nucli de «les ulleres de sol»?','ulleres','sol','les','Ulleres és el nom principal. De sol indica de quin tipus són i les és el determinant.');
m('sn','Afegeix a «el cofre» un complement de tipus «que + oració».','que vam trobar ahir','del tresor','misteriós','Que vam trobar ahir inclou que i un verb. Del tresor és preposició + SN; misteriós és un adjectiu.');
m('sn','Quin és el subjecte complet de «Els meus amics de classe preparen una excursió»?','Els meus amics de classe','amics','una excursió','El subjecte és tot el SN Els meus amics de classe. Amics n’és només el nucli. Una excursió és allò que preparen.');
w('sn','Escriu el nucli de «La porta d’entrada».','porta','Porta és el nom principal; la el determina i d’entrada el complementa.','Què és allò que és d’entrada?');
m('sn','Quin grup concorda en femení singular?','Una científica innovadora','Una científics innovadores','Un científica innovadora','Una, científica i innovadora són femenins singulars. Científics és masculí plural; un és masculí singular.');
m('sn','A «L’estudiant aplicat», «aplicat» fa de…','Complement del nom: adjectiu','Nucli','Determinant','Aplicat explica com és l’estudiant. Estudiant és el nucli i l’ és el determinant.');
m('sn','Quin SN té un complement amb preposició?','Una cosina de la Berta','Un avi simpàtic','La veïna que em trobo al replà','De la Berta comença amb de. Simpàtic és adjectiu; que em trobo al replà és una oració.');
m('sn','Quina expressió està ben escrita?','Les sabates noves','La sabates noves','Les sabates nova','Sabates és femení plural: necessita les i noves. La i nova són singulars.');
m('sn','Pot existir un SN sense determinant?','Sí: «Nosaltres»','No, sempre necessita article','Només si té un adjectiu','Nosaltres és un pronom que pot formar tot el SN. Determinants i complements no són sempre necessaris.');
w('sn','Escriu el complement sencer de «el certificat de treball».','de treball','De treball complementa certificat i té l’estructura preposició + SN.','Inclou també la preposició.');
m('lex','Quina paraula és primitiva?','neu','desfer','tenista','Neu no deriva d’una altra paraula en aquest exercici. Desfer porta des- i tenista deriva de tenis.');
m('lex','«Supermercat» és una paraula…','Derivada amb prefix','Composta de dues paraules simples','Primitiva','Super- és un prefix afegit a mercat. Un prefix no és una paraula simple independent.');
w('lex','De quina paraula primitiva ve «emmarcar»?','marc','Emmarcar ve de marc. Marcar és un verb relacionat, però la base demanada és marc.','Què poses al voltant d’una fotografia?');
w('lex','De quina paraula primitiva ve «retallar»?','tallar','La base és el verb tallar. Tallant és una forma verbal, no la paraula primitiva que demana la fitxa.','Escriu el verb en infinitiu.');
m('lex','Quina paraula és de la família de «mar»?','mariner','martell','marc','Mariner comparteix arrel i significat amb mar. Martell i marc només tenen lletres semblants.');
m('lex','Quines peces formen «llevataps»?','lleva + taps','llevar + taps','lleva + taules','Hi trobem lleva i taps: dues paraules simples. L’infinitiu llevar no hi apareix sencer.');
w('lex','Uneix «trenca» + «closques».','trencaclosques','Trencaclosques és composta i s’escriu junta.','No necessita guionet.');
w('lex','Uneix «para» + «xocs» amb l’ortografia correcta.','para-xocs','Para-xocs porta guionet. En aquest compost la segona peça comença per x.','Hi ha un guionet entre les dues peces.');
m('lex','Quin prefix té «invisible»?','in-','-ible','vis-','In- va al davant i expressa negació. -ible és un sufix de possibilitat, no el prefix.');
m('lex','Quin sufix hi ha a «pastisset»?','-et','pas-','-ós','El sufix -et s’afegeix a pastís i hi aporta un valor diminutiu. El prefix aniria al davant.');
w('lex','Com es diu «tornar a elegir» amb re-?','reelegir','Re- + elegir = reelegir. Conservem les dues e: la del prefix i la d’elegir.','No perdis cap de les dues e!');
w('lex','Persona que ven fruita: forma el mot amb -er.','fruiter','Fruita → fruiter, l’ofici demanat. Verduler és un altre mot i no està format sobre fruita.','fruita → fruit…');
w('lex','Forma un nom amb «dur» i el sufix -esa.','duresa','Duresa és la qualitat d’allò que és dur. -esa és al darrere i, per tant, és un sufix.','dur + esa');
w('lex','Completa amb des-, re- o in-: «___còmode».','in','Incòmode vol dir que no és còmode: in- és un prefix de negació.','Volem dir «no còmode».');
m('lex','Què significa «semi-»?','La meitat','Repetició','Després','Semi- és meitat (semicercle). Re- és repetició; post-/pos- és posterioritat.');
m('lex','Què significa «inter-»?','Entre','Al voltant','Fals','Inter- significa entre. Circum- vol dir al voltant i pseudo-, fals.');
m('lex','Quina paraula té un sufix?','plujós','prehistòria','descontent','Plujós es forma amb -ós. Prehistòria té el prefix pre- i descontent, des-.');
m('lex','Quin sufix forma un diminutiu?','-eta','-assa','-ot','-eta forma diminutius (tauleta). -assa és augmentatiu i -ot pot ser despectiu.');
m('lex','Quines peces formen «penja-roba»?','penja + roba','penjar + roba','penja + robar','Penja-roba uneix penja i roba. No conté l’infinitiu penjar complet.');
m('lex','Quina paraula vol dir «que no és capaç»?','incapaç','recapaç','precapaç','In- nega capaç. Re- indicaria repetició i pre-, anterioritat.');
m('lex','Què aporta -ible a «llegible»?','Possibilitat: es pot llegir','Un ofici','Una mida petita','-ible indica possibilitat. Els oficis sovint porten -er/-era; els diminutius, -et/-eta.');
m('lex','Quina parella és primitiva → derivada?','taula → tauleta','mariner → mar','para → para-sol','Tauleta porta el sufix -eta. Mariner → mar va al revés. Para-sol és composta.');
m('lex','Quin prefix indica posterioritat?','post-','ante-','vice-','Post- i pos- indiquen després. Ante- indica abans/davant; vice-, un càrrec immediatament inferior.');
m('lex','Què pot indicar el sufix -atge?','Un col·lectiu, com fullatge','Negació','Repetició','Fullatge és un conjunt de fulles. La negació pot expressar-se amb in-; la repetició, amb re-.');
m('pun','Tria la frase ben puntuada.','Necessito tres coses: pa, llet i ous.','Necessito tres coses, pa llet i ous.','Necessito: tres coses pa, llet, i ous.','Els dos punts van després d’anunciar la llista (tres coses). Les comes separen els elements; no cal coma abans de la i final.');
m('pun','Què va després de «La Maria va dir», abans de citar-la?','Dos punts (:)','Punt i coma (;)','Parèntesi (()','Els dos punts introdueixen les paraules exactes. Les cometes delimiten allò que diu la Maria.');
m('pun','Tria la frase que delimita bé l’aclariment.','El meu germà, que té dotze anys, juga a bàsquet.','El meu germà que té dotze anys, juga a bàsquet.','El meu germà, que té dotze anys juga a bàsquet.','Si que té dotze anys és un aclariment, necessita dues comes. Una sola deixa l’incís obert.');
m('pun','Com cridem en Pau?','Pau, vine aquí!','Pau vine, aquí!','Pau vine aquí,','Pau és un vocatiu: el nom de la persona a qui parlem. La coma el separa de la resta de la frase.');
m('pun','Quin signe deixa una llista oberta?','Els punts suspensius (…)','El punt (.)','Les cometes (« »)','Els tres punts indiquen que la llista pot continuar. El punt la tanca i les cometes marquen citacions, títols o doble sentit.');
m('pun','Com comença una oració nova després d’un punt?','Amb majúscula','Amb minúscula','Sempre amb dos punts','Després del punt que tanca una oració, la nova comença amb majúscula: M’agrada llegir. És divertit.');
m('pun','On va millor el punt i coma?','La trama és fascinant; en canvi, el final és fluix.','La trama; és fascinant en canvi el final és fluix.','La trama és fascinant en; canvi, el final és fluix.','El punt i coma separa les dues idees que contrasten. No separa subjecte i verb ni les paraules d’en canvi.');
m('pun','Què fan els parèntesis a «Cada bienni (període de dos anys)…»?','Afegeixen un aclariment','Citen paraules exactes','Deixen la frase inacabada','Període de dos anys explica bienni. És informació extra tancada entre parèntesis. Una citació aniria entre cometes.');
m('pun','A «Les seves amigues són molt «simpàtiques»», les cometes poden indicar…','Ironia o doble sentit','Una enumeració','Una pregunta directa','Les cometes poden indicar que simpàtiques s’utilitza amb ironia i no amb el seu sentit habitual.');
m('pun','Tria la pregunta ben escrita.','La mestra va preguntar: «Heu acabat els deures?»','La mestra va preguntar: «Heu acabat els deures».','La mestra, va preguntar «Heu acabat els deures».','És una pregunta directa: acaba amb ?. Els dos punts introdueixen la citació. No separem La mestra del verb amb una coma.');
m('pun','On van els parèntesis?','Els alumnes de cicle superior (cinquè i sisè) organitzen la festa.','Els alumnes (de cicle superior cinquè) i sisè organitzen la festa.','Els alumnes de cicle superior (cinquè i sisè organitzen la festa).','Cinquè i sisè és l’aclariment de cicle superior. Organitzen la festa és informació principal i queda fora.');
w('pun','Escriu només el signe: «Cal portar el material següent ___ paper, llapis i goma».',':','El material següent anuncia una llista: els dos punts la introdueixen.','Dos puntets, un damunt de l’altre.');
m('pun','Quina oració evita una coma incorrecta?','La mestra explica el conte.','La mestra, explica el conte.','La, mestra explica el conte.','No separem el subjecte La mestra i el verb explica amb una coma si no hi ha cap incís.');
m('pun','Què indiquen les cometes de «Llegeix «La migració de les aus»»?','El títol d’un text','Un aclariment','Una llista oberta','Delimiten el títol del text. Un aclariment podria anar entre parèntesis; una llista oberta acaba amb punts suspensius.');
m('pun','Quina frase introdueix bé una explicació?','Només volia una cosa: prendre un bon bany.','Només volia: una cosa prendre un bon bany.','Només volia una: cosa prendre un bon bany.','Prendre un bon bany explica quina era aquella cosa. Els dos punts van després de la idea anunciada completa.');
m('pun','Quina enumeració està ben puntuada?','M’agraden les maduixes, les cireres i el meló.','M’agraden, les maduixes les cireres i el meló.','M’agraden les maduixes les cireres, i el meló.','La coma separa maduixes de cireres i la i uneix l’últim element. No cal coma entre el verb i la llista.');
m('pun','Quina versió separa bé les oracions?','Ahir vam visitar el museu. Avui en parlarem.','Ahir vam visitar el museu. avui en parlarem.','Ahir vam visitar. El museu avui en parlarem.','El punt tanca una idea completa i Avui comença amb majúscula. No trenquem vam visitar el museu per la meitat.');
m('pun','Com marquem les paraules exactes que ha dit algú?','Amb cometes','Sempre amb parèntesis','Sempre amb punts suspensius','Les cometes marquen una citació textual. Els parèntesis afegeixen informació i els punts suspensius deixen una idea oberta.');
m('contr','Quina és la contracció de a + el?','al','a el','a l’','a + el s’escriu en una sola paraula: al. Davant la o l’ no es contrau.');
m('contr','Quina és la contracció de de + els?','dels','de els','des','de + els forma dels.');
m('contr','Quina frase està ben escrita?','Vaig a l’escola.','Vaig al escola.','Vaig a’escola.','Escola comença amb vocal i l’article s’apostrofa: a l’escola. No escrivim al escola.');
m('contr','Completa: «Passegem ___ camí del bosc».','pel','per el','per l’','per + el es contreu: pel camí.');
m('contr','Completa: «Arribem ___ volts de les cinc».','als','a els','a l’s','a + els forma als.');
m('contr','Quina forma és correcta per dir “a casa de l’avi”?','a ca l’avi','a cal avi','al ca l’avi','Davant l’article apostrofat l’ no fem contracció: ca l’avi. Cal seria ca + el.');
m('contr','Quina forma vol dir “casa d’en Ramon”?','a can Ramon','a cal Ramon','a ca en Ramon','ca + l’article personal en forma can: a can Ramon.');
m('contr','Amb quins articles es contreuen a, de i per?','el i els','la i les','l’','Les contraccions són al/als, del/dels i pel/pels. No es fan amb la, les ni l’.');
m('contr','Quina és la forma plural de «pel jardí»?','pels jardins','per els jardins','pels jardí','per + els forma pels: passejar pels jardins.');
m('contr','Completa: «Porten les disfresses ___ seus amics».','dels','de les','de l’','seus és masculí plural i porta l’article els: de + els = dels.');
m('contr','Completa: «Els llibres són ___ Eva».','de l’Eva','del Eva','dels Eva','Eva comença amb vocal; l’article s’apostrofa i no es contreu: de l’Eva.');
w('contr','Escriu la contracció: per + el.','pel','per + el es contrau i s’escriu pel.','Una sola paraula, com a + el = al.');
w('contr','Completa: «Vaig a ___ metge» (casa del metge).','cal','ca + el forma cal: vaig a cal metge.','És la forma de ca + el.');
w('contr','Completa amb la forma correcta: «Tornem ___ hort».','de l’hort','hort comença amb vocal: de + l’hort. No escrivim del hort.','L’article davant vocal porta apòstrof.');
w('contr','Completa amb ca: «Anirem a ___ Marta» (casa de la Marta).','ca la','Amb l’article femení la no es forma contracció: ca la Marta.','Ca + la es manté en dues paraules.');
</script><script>const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={mastered:[],review:[],seen:[]},storageOK=true,session=null,currentTopic='sn';
try{const saved=JSON.parse(localStorage.getItem('missio-catala-v1'));if(saved&&['mastered','review','seen'].every(k=>Array.isArray(saved[k])))for(const k of ['mastered','review','seen'])state[k]=[...new Set(saved[k].filter(id=>questions.some(q=>q.id===id)))];}catch{storageOK=false;}
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function save(){try{localStorage.setItem('missio-catala-v1',JSON.stringify(state));}catch{storageOK=false;}stats();}
function stats(){$('#stars').textContent=`✦ ${state.mastered.length} estrelles`;$('#review-count').textContent=state.review.length;}
function header(label,title,desc){return `<a class="back" href="#inici">← Torna al mapa</a><p class="eyebrow">${label}</p><h1>${title}</h1><p>${desc}</p>`;}
function notice(){return storageOK?'':'<p class="storage-note">Aquest navegador no permet desar el progrés. Pots practicar igualment; el progrés durarà aquesta sessió.</p>';}
function topicCards(){return topics.map((t,i)=>{let n=questions.filter(q=>q.t===t.id).length,done=questions.filter(q=>q.t===t.id&&state.mastered.includes(q.id)).length;return `<article class="topic"><div class="topic-top ${['mint','peach','lavender','mint'][i]}"><span class="topic-icon" aria-hidden="true">${t.icon}</span><small>MISSIÓ 0${i+1} · ${t.label}</small><h3>${t.name}</h3></div><div class="topic-body"><p>${t.desc}</p><span class="tiny">${t.lessons.length} fitxes de teoria · ${n} exercicis · ${done}/${n} apresos</span><div class="topic-links"><a href="#teoria/${t.id}">Llegeix la teoria</a><a href="#joc/${t.id}">Practica →</a></div></div></article>`}).join('');}
function home(){app.innerHTML=`<section class="hero"><div><span class="pill">LA TEVA AVENTURA DE LLENGUA · 6è</span><h1>Les grans missions<br>comencen amb<br><em>petites paraules.</em></h1><p>Explora, prova i descobreix tot el que ja saps. Preparar l’examen també pot ser una aventura!</p><div class="actions"><a class="primary button" href="#exercicis" style="padding:12px 22px;border-radius:13px;font-weight:bold">Som-hi! Tria una missió →</a><a class="secondary button" href="#teoria" style="padding:12px 22px;border-radius:13px;border:1px solid #c7bfdc;font-weight:bold">Primer, una mica de teoria</a></div><div class="hero-note">✧ Al teu ritme &nbsp; · &nbsp; Sense rellotge &nbsp; · &nbsp; Equivocar-se també és aprendre</div></div><div class="art" aria-label="Un planeta somrient amb paraules i estrelles" role="img"><div class="planet"><div class="eyes"><i></i><i></i></div><div class="smile"></div><div class="cheek"></div></div><div class="orbit"></div><span class="float f1">a b c</span><span class="float f2">?!</span><span class="spark">✦</span><span class="speech">Tu pots amb això! ✨</span></div></section>${notice()}<div class="progress-strip"><span style="font-size:26px">🌱</span><div><strong>La teva aventura va creixent</strong><p>Cada resposta apresa és una nova estrella.</p></div><div class="progress-track" aria-label="${state.mastered.length} de ${questions.length} apresos"><span style="width:${state.mastered.length/questions.length*100}%"></span></div><strong>${state.mastered.length} / ${questions.length}</strong></div><div class="section-heading"><div><span class="eyebrow">EL TEU MAPA</span><h2>Quatre missions per descobrir</h2></div><p>Tria per on vols començar.<br>Totes les missions estan obertes.</p></div><section class="cards">${topicCards()}</section><section class="bottom-band"><div><strong>🚀 A punt per a una mica de tot?</strong><p>Assaig d’examen: 16 preguntes, quatre de cadascuna de les quatre missions, sense límit de temps.</p></div><a href="#joc/examen" class="back">Comença l’assaig →</a></section>`;}
function theory(id){currentTopic=topics.some(t=>t.id===id)?id:'sn';let t=topics.find(t=>t.id===currentTopic);app.innerHTML=header('LA TEORIA, A PETITES DOSIS','Una pista. Un exemple.<br><em>I ja ho tens més clar.</em>','Obre una fitxa, llegeix-la amb calma i després posa-la a prova.')+`<div class="tabs" role="group" aria-label="Temes">${topics.map(x=>`<button class="${x.id===t.id?'selected':''}" data-topic="${x.id}">${x.icon} ${x.label}</button>`).join('')}</div><div class="lesson-grid">${t.lessons.map((l,i)=>`<details class="lesson" ${i===0?'open':''}><summary>${l[0]}</summary><p>${l[1]}</p><div class="example"><b>Mira aquest exemple</b>${esc(l[2])}</div></details>`).join('')}</div><div class="bottom-band"><div><strong>Una mica de pràctica ho fixa millor.</strong><p>Prova una missió de 6 preguntes. Pots tornar a la teoria quan vulguis.</p></div><a class="back" href="#joc/${t.id}">Practica ${t.label.toLowerCase()} →</a></div>`;app.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>location.hash='teoria/'+b.dataset.topic);}
function exercises(){app.innerHTML=header('ENTRENA AL TEU RITME','Avui, quina missió<br><em>et ve de gust?</em>','Cada ronda té 6 preguntes. Hi ha pistes, explicacions i una pausa quan la necessitis.')+`<section class="cards" style="margin-top:30px">${topicCards()}</section><div class="bottom-band"><div><strong>🚀 Assaig d’examen</strong><p>16 preguntes: 4 de cada missió. Correcció després de cada resposta, sense rellotge.</p></div><a class="back" href="#joc/examen">Posa’m a prova →</a></div>`;}
function start(mode){let pool;if(mode==='examen')pool=shuffle(topics.flatMap(t=>shuffle(questions.filter(q=>q.t===t.id)).slice(0,4)));else if(mode==='repas')pool=shuffle(questions.filter(q=>state.review.includes(q.id))).slice(0,6);else{let all=questions.filter(q=>q.t===mode);pool=[...shuffle(all.filter(q=>!state.mastered.includes(q.id))),...shuffle(all.filter(q=>state.mastered.includes(q.id)))].slice(0,6);}session={mode,qs:pool,index:0,correct:0,answered:false,results:[],paused:false};renderQuiz();}
function renderQuiz(){let s=session;if(!s||!s.qs.length){app.innerHTML=header('EL TEU REPÀS','Cap pregunta pendent! 🌱','Pots començar una nova missió per seguir descobrint coses.')+'<a class="back" href="#exercicis">Tria una missió →</a>';return;}if(s.index>=s.qs.length){results();return;}let q=s.qs[s.index],t=topics.find(t=>t.id===q.t);s.answered=false;s.order=q.opts?shuffle(q.opts.map((text,i)=>({text,i}))):null;
app.innerHTML=`<div class="quiz-wrap"><a class="back" href="#exercicis">← Surt de la ronda</a><div class="quiz-meta"><span>${s.mode==='examen'?'🚀 Assaig d’examen':s.mode==='repas'?'🌱 Tornem-ho a provar':t.icon+' '+t.name}</span><span>Pregunta ${s.index+1} de ${s.qs.length}</span></div><div class="progress-track"><span style="width:${s.index/s.qs.length*100}%"></span></div><article class="quiz"><span class="pill">${t.label} · ${q.opts?'Tria una resposta':'Escriu la resposta'}</span><h2 id="question">${esc(q.q)}</h2>${q.opts?`<div class="answers" role="group" aria-labelledby="question">${s.order.map((a,i)=>`<button class="answer" data-answer="${a.i}"><span>${'ABC'[i]}</span>${esc(a.text)}</button>`).join('')}</div>`:`<form id="write-form"><label class="tiny" for="answer-input">La teva resposta (revisa els accents i els guionets)</label><input id="answer-input" class="answer-input" autocomplete="off" spellcheck="false" required><button class="primary" style="margin-top:16px">Comprova la resposta</button></form>`}<div id="response" aria-live="polite" aria-atomic="true"></div><div id="hint-area"></div><div class="quiz-bottom"><button class="text-btn" id="hint">💡 Una pista</button><button class="text-btn" id="pause">☁ Fem una pausa</button><a class="text-btn" href="#teoria/${q.t}" target="_blank" rel="noopener">Consulta la teoria ↗</a></div></article><p class="tiny" style="text-align:center;margin-top:25px">Les estrelles no es perden. Els errors només ens diuen què podem practicar.</p></div>`;
app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer),b));if(!q.opts)$('#write-form').onsubmit=e=>{e.preventDefault();let v=$('#answer-input').value.trim();if(v)answer(v);};$('#hint').onclick=()=>{$('#hint-area').innerHTML=`<p class="hint">💡 ${esc(q.hint||q.ex)}</p>`;$('#hint').disabled=true;};$('#pause').onclick=pause;}
function normalize(s){return s.normalize('NFC').toLocaleLowerCase('ca').replace(/[’‘]/g,"'").replace(/[‐‑–]/g,'-').replace(/\s+/g,' ').trim();}
function answer(v,b){let s=session;if(s.answered)return;s.answered=true;let q=s.qs[s.index],ok=q.opts?v===0:normalize(v)===normalize(q.answer);if(!state.seen.includes(q.id))state.seen.push(q.id);if(ok){s.correct++;if(!state.mastered.includes(q.id))state.mastered.push(q.id);state.review=state.review.filter(id=>id!==q.id);}else{if(!state.review.includes(q.id))state.review.push(q.id);state.mastered=state.mastered.filter(id=>id!==q.id);}s.results.push({id:q.id,ok});save();app.querySelectorAll('[data-answer]').forEach(el=>{el.disabled=true;if(+el.dataset.answer===0)el.classList.add('correct');else if(el===b)el.classList.add('wrong');});if(!q.opts){$('#answer-input').disabled=true;$('#write-form button').disabled=true;}
$('#response').innerHTML=`<div class="feedback ${ok?'':'retry'}"><h3>${ok?['✨ Molt ben pensat!','🌟 Ho has descobert!','🎉 Bona feina, exploradora!'][s.index%3]:['🌱 Tranquil·la, això també és aprendre.','🔎 Bona prova! Mirem la pista juntes.','💛 Encara ho estàs aprenent. Som-hi!'][s.index%3]}</h3>${!ok?`<p>Has respost: <strong>${esc(q.opts?q.opts[v]:v)}</strong></p><p>La resposta correcta és: <strong>${esc(q.opts?q.opts[0]:q.answer)}</strong></p>`:''}<p><strong>Per què?</strong> ${esc(q.ex)}</p>${!ok?'<p class="tiny">Aquesta pregunta t’espera a «El meu repàs». La propera vegada tindràs una pista més!</p>':''}<button class="primary" id="next">${s.index+1===s.qs.length?'Veure com ha anat':'Següent repte →'}</button></div>`;$('#next').onclick=()=>{s.index++;renderQuiz();focusMain();};$('#hint').disabled=true;}
function pause(){const d=document.createElement('dialog');d.innerHTML='<div class="pause"><span class="result-icon">☁️</span><h2>Una pausa també és part de la missió.</h2><p>Estira els braços, beu una mica d’aigua i mira lluny de la pantalla.</p><p>Tu marques el ritme.</p><button class="primary">Ja estic a punt →</button></div>';document.body.appendChild(d);d.querySelector('button').onclick=()=>d.close();d.onclose=()=>d.remove();d.showModal();}
function results(){let s=session;app.innerHTML=`<div class="quiz-wrap"><section class="results"><span class="result-icon">${s.correct===s.qs.length?'🌟':'🌱'}</span><p class="eyebrow">MISSIÓ COMPLETADA</p><h1>${s.correct===s.qs.length?'Una ronda estel·lar!':'Avui has fet un pas més!'}</h1><div class="result-score">${s.correct} / ${s.qs.length}</div><p>respostes encertades en aquesta ronda</p><p>${s.correct===s.qs.length?'Has connectat totes les pistes. Celebra la feina feta!':'Cada explicació que has llegit t’ajuda a entendre-ho millor. Practiquem les que han costat?'}</p><div class="actions"><a class="back" href="#repas">Repassa amb calma →</a><button class="primary" id="again">Una altra ronda</button><a class="back" href="#inici">Torna al mapa</a></div></section><h2 style="margin-top:30px">Les pistes d’aquesta ronda</h2>${s.results.map(r=>{let q=questions.find(x=>x.id===r.id);return `<details class="lesson" style="margin:12px 0"><summary>${r.ok?'✓':'↻'} ${esc(q.q)}</summary><p><strong>${esc(q.opts?q.opts[0]:q.answer)}</strong></p><p>${esc(q.ex)}</p></details>`}).join('')}</div>`;$('#again').onclick=()=>start(s.mode);}
function review(){let qs=questions.filter(q=>state.review.includes(q.id));app.innerHTML=header('ELS ERRORS ES CONVERTEIXEN EN PISTES','Un altre intent.<br><em>Una mica més a prop.</em>','Aquí tens les preguntes que et poden anar bé per practicar. Quan les encertis, sortiran del repàs.')+notice()+(qs.length?`<div class="actions"><a href="#joc/repas" class="primary" style="padding:12px 20px;border-radius:13px">Practica el repàs · ${Math.min(6,qs.length)} preguntes →</a></div>${qs.map(q=>`<details class="review-item"><summary>${esc(q.q)}</summary><p>Resposta: <strong>${esc(q.opts?q.opts[0]:q.answer)}</strong></p><p>${esc(q.ex)}</p><a class="back" href="#teoria/${q.t}">Mira la teoria del tema →</a></details>`).join('')}`:'<div class="empty"><span class="result-icon">🌱</span><h2>El teu repàs està al dia!</h2><p>Encara no hi ha preguntes pendents. Comença una missió o segueix practicant.</p><a class="back" href="#exercicis">Descobreix els exercicis →</a></div>');}
function focusMain(){app.setAttribute('tabindex','-1');app.focus({preventScroll:true});window.scrollTo(0,0);}
function route(){let [p,id]=location.hash.slice(1).split('/');document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+(p||'inici')));if(p==='teoria')theory(id);else if(p==='exercicis')exercises();else if(p==='repas')review();else if(p==='joc'&&['sn','lex','pun','contr','examen','repas'].includes(id))start(id);else home();focusMain();stats();}
$('#reset').onclick=()=>$('#reset-dialog').showModal();$('#cancel-reset').onclick=()=>$('#reset-dialog').close();$('#confirm-reset').onclick=()=>{state={mastered:[],review:[],seen:[]};save();$('#reset-dialog').close();location.hash='inici';route();};window.addEventListener('hashchange',route);route();

</script></body></html>
